<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>いまここ情報</title>
<meta name="description" content="現在地の天気・災害情報・鉄道運行情報">
<meta name="theme-color" content="#0f172a">
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --accent:#2563eb; --ok:#16a34a; --warn:#eab308; --alert:#dc2626; --danger:#7c3aed; --emerg:#111827;
  --chip:#f1f5f9;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b1220; --card:#131c2e; --text:#e5e7eb; --muted:#94a3b8; --line:#23304a; --chip:#1c2740; --emerg:#000; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:8px;justify-content:space-between}
h1{font-size:1.15rem;margin:0}
#place{font-size:.85rem;color:var(--muted)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:10px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:960px;margin:0 auto;padding:12px 16px 40px;display:grid;gap:12px}
@media (min-width:860px){ main{grid-template-columns:1fr 1fr} .wide{grid-column:1/-1} }
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card h2{font-size:1rem;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 small{font-weight:normal;color:var(--muted);font-size:.75rem}
.muted{color:var(--muted);font-size:.85rem}
.err{color:var(--alert);font-size:.9rem}
a{color:var(--accent)}
.now{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.now .icon{font-size:3rem;line-height:1}
.now .temp{font-size:2.6rem;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:12px}
.stat{background:var(--chip);border-radius:10px;padding:8px 10px}
.stat .k{font-size:.75rem;color:var(--muted)}
.stat .v{font-size:1.05rem;font-weight:600}
.arrow{display:inline-block;transition:transform .3s}
.hours{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.hour{flex:0 0 58px;text-align:center;background:var(--chip);border-radius:10px;padding:6px 2px;font-size:.8rem}
.hour .e{font-size:1.3rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-size:.75rem;color:var(--muted);font-weight:normal}
td.d{text-align:left}
.hi{color:#ef4444;font-weight:600}.lo{color:#3b82f6;font-weight:600}
.sun{color:#ef4444}.sat{color:#3b82f6}
.badge{display:inline-block;border-radius:8px;padding:3px 10px;margin:3px 4px 3px 0;font-size:.9rem;font-weight:600;color:#fff}
.b-adv{background:var(--warn);color:#111}.b-war{background:var(--alert)}.b-dng{background:var(--danger)}.b-emg{background:var(--emerg);border:2px solid #a855f7}
.list{list-style:none;margin:0;padding:0}
.list li{padding:8px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:none}
.scale{display:inline-block;min-width:2.6em;text-align:center;border-radius:6px;padding:0 6px;font-weight:700;margin-right:6px}
.s1,.s2{background:#e0f2fe;color:#075985}.s3{background:#bbf7d0;color:#14532d}.s4{background:#fef08a;color:#713f12}
.s5{background:#fb923c;color:#fff}.s6{background:#dc2626;color:#fff}.s7{background:#7e22ce;color:#fff}
.banner{border-radius:12px;padding:12px 14px;color:#fff;background:var(--alert);font-weight:600}
.okline{color:var(--ok);font-weight:600}
.line-delay{display:flex;justify-content:space-between;gap:8px}
.line-delay .co{color:var(--muted);font-size:.8rem}
footer{max-width:960px;margin:0 auto;padding:0 16px 30px;font-size:.75rem;color:var(--muted)}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>📍 いまここ情報</h1>
    <button id="refresh" class="primary">更新</button>
  </div>
  <div id="place">位置情報を取得しています…</div>
</header>

<main>
  <div id="tsunami" class="wide" hidden></div>

  <section class="card wide" id="weather">
    <h2>現在の天気 <small id="wTime"></small></h2>
    <div class="muted">読み込み中…</div>
  </section>

  <section class="card wide">
    <h2>24時間の予報</h2>
    <div id="hourly" class="hours"><span class="muted">読み込み中…</span></div>
  </section>

  <section class="card wide">
    <h2>週間天気</h2>
    <div id="daily"><span class="muted">読み込み中…</span></div>
  </section>

  <section class="card">
    <h2>警報・注意報 <small id="warnTime"></small></h2>
    <div id="warnings"><span class="muted">読み込み中…</span></div>
  </section>

  <section class="card">
    <h2>最近の地震 <small>震度1以上</small></h2>
    <div id="quakes"><span class="muted">読み込み中…</span></div>
  </section>

  <section class="card wide">
    <h2>鉄道運行情報 <small id="trainTime"></small></h2>
    <div id="trains"><span class="muted">読み込み中…</span></div>
  </section>
</main>

<footer>
  データ：<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>（CC BY 4.0）／
  <a href="https://www.jma.go.jp/" target="_blank" rel="noopener">気象庁</a>／
  <a href="https://maps.gsi.go.jp/" target="_blank" rel="noopener">国土地理院</a>（逆ジオコーダ）／
  <a href="https://www.p2pquake.net/" target="_blank" rel="noopener">P2P地震情報</a>／
  <a href="https://rti-giken.jp/fhc/api/train_tetsudo/" target="_blank" rel="noopener">鉄道遅延情報のJSON</a>。
  情報は参考用です。避難等の判断は自治体・気象庁の発表に従ってください。
</footer>

<script>
"use strict";
const $ = s => document.querySelector(s);
const S = { lat:null, lon:null, acc:null, prefCode:null, prefName:null, city:null, class20:null, class10:null, office:null };

const PREFS = ["","北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];

/* ---------- utils ---------- */
async function getJSON(url){
  const r = await fetch(url, { cache:"no-store" });
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const WD = ["日","月","火","水","木","金","土"];
function fmtTime(d){ d = new Date(d); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function hm(iso){ return iso ? iso.slice(11,16) : "—"; }
function dirName(deg){
  const n = ["北","北北東","北東","東北東","東","東南東","南東","南南東","南","南南西","南西","西南西","西","西北西","北西","北北西"];
  return n[Math.round(deg/22.5) % 16];
}
function distKm(a,b,c,d){
  const R=6371, toR=x=>x*Math.PI/180;
  const dl=toR(c-a), dn=toR(d-b);
  const h=Math.sin(dl/2)**2+Math.cos(toR(a))*Math.cos(toR(c))*Math.sin(dn/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function store(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function load(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }

/* WMO 天気コード */
function wmo(c){
  const m = {
    0:["☀️","快晴"],1:["🌤️","晴れ"],2:["⛅","晴れ時々曇り"],3:["☁️","曇り"],
    45:["🌫️","霧"],48:["🌫️","霧(着氷)"],
    51:["🌦️","弱い霧雨"],53:["🌦️","霧雨"],55:["🌧️","強い霧雨"],56:["🌧️","着氷性の霧雨"],57:["🌧️","着氷性の霧雨"],
    61:["🌧️","弱い雨"],63:["🌧️","雨"],65:["🌧️","強い雨"],66:["🌧️","着氷性の雨"],67:["🌧️","着氷性の強い雨"],
    71:["🌨️","弱い雪"],73:["🌨️","雪"],75:["❄️","強い雪"],77:["🌨️","霧雪"],
    80:["🌦️","にわか雨"],81:["🌧️","強いにわか雨"],82:["⛈️","激しいにわか雨"],
    85:["🌨️","にわか雪"],86:["❄️","強いにわか雪"],
    95:["⛈️","雷雨"],96:["⛈️","雷雨(ひょう)"],99:["⛈️","激しい雷雨(ひょう)"]
  };
  return m[c] || ["❔","不明"];
}

/* ---------- 位置情報 ---------- */
function locate(){
  $("#place").innerHTML = '<span class="spin">⏳</span> 位置情報を取得しています…';
  if(!("geolocation" in navigator)){ return locFail("このブラウザは位置情報に対応していません。"); }
  navigator.geolocation.getCurrentPosition(p => {
    S.lat = +p.coords.latitude.toFixed(4); S.lon = +p.coords.longitude.toFixed(4); S.acc = Math.round(p.coords.accuracy);
    store("lastLoc", { lat:S.lat, lon:S.lon });
    loadAll();
  }, e => {
    const msg = { 1:"位置情報の利用が許可されていません。", 2:"位置を特定できませんでした。", 3:"位置情報の取得がタイムアウトしました。" }[e.code] || "位置情報を取得できませんでした。";
    locFail(msg);
  }, { enableHighAccuracy:true, timeout:15000, maximumAge:300000 });
}
function locFail(msg){
  const last = load("lastLoc");
  $("#place").innerHTML = `<span class="err">${esc(msg)}</span> `
    + (last ? '<button id="useLast">前回の場所で表示</button> ' : "")
    + '<button id="useTokyo">東京駅で表示</button>';
  if(last) $("#useLast").onclick = () => { S.lat=last.lat; S.lon=last.lon; S.acc=null; loadAll(); };
  $("#useTokyo").onclick = () => { S.lat=35.6812; S.lon=139.7671; S.acc=null; loadAll(); };
}

/* ---------- 地名・気象庁コード ---------- */
let AREA = null;
async function resolvePlace(){
  const g = await getJSON(`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${S.lat}&lon=${S.lon}`);
  const muni = String(g?.results?.muniCd ?? "").padStart(5,"0");
  if(!/^\d{5}$/.test(muni) || muni === "00000") throw new Error("日本国外、または住所を特定できない地点です");
  S.prefCode = parseInt(muni.slice(0,2),10);
  S.prefName = PREFS[S.prefCode];
  S.town = g.results.lv01Nm && g.results.lv01Nm !== "－" ? g.results.lv01Nm : "";

  if(!AREA) AREA = await getJSON("https://www.jma.go.jp/bosai/common/const/area.json");
  const c20s = AREA.class20s;
  let code = c20s[muni + "00"] ? muni + "00" : null;
  if(!code) code = Object.keys(c20s).find(k => k.startsWith(muni)) || null;
  if(!code){ const city = muni.slice(0,4) + "000"; if(c20s[city]) code = city; }       // 政令市の区 → 市
  if(!code){ const city = muni.slice(0,3) + "0000"; if(c20s[city]) code = city; }
  if(!code) throw new Error("気象庁の地域コードが見つかりません");
  S.class20 = code;
  S.city = c20s[code].name;
  const c15 = AREA.class15s[c20s[code].parent];
  S.class10 = c15?.parent;
  S.office = AREA.class10s[S.class10]?.parent;
}

function renderPlace(){
  const name = [S.prefName, S.city, S.town].filter(Boolean).join(" ");
  $("#place").innerHTML = `${esc(name || "現在地")} <span class="muted">(${S.lat}, ${S.lon}${S.acc ? ` ±${S.acc}m` : ""})</span>`;
}

/* ---------- 気象 (Open-Meteo) ---------- */
async function loadWeather(){
  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + S.lat + "&longitude=" + S.lon
    + "&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m"
    + "&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_direction_10m"
    + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,sunrise,sunset,wind_speed_10m_max,wind_direction_10m_dominant"
    + "&timezone=Asia%2FTokyo&forecast_days=7&wind_speed_unit=ms";
  try{
    const w = await getJSON(url);
    const c = w.current, d = w.daily, h = w.hourly;
    const [ic, tx] = wmo(c.weather_code);
    $("#weather").innerHTML = `
      <h2>現在の天気 <small>${fmtTime(c.time)} 時点</small></h2>
      <div class="now">
        <div class="icon">${ic}</div>
        <div><div class="temp">${Math.round(c.temperature_2m*10)/10}℃</div><div>${tx}・体感 ${Math.round(c.apparent_temperature)}℃</div></div>
        <div class="muted">今日 <span class="hi">${Math.round(d.temperature_2m_max[0])}℃</span> / <span class="lo">${Math.round(d.temperature_2m_min[0])}℃</span></div>
      </div>
      <div class="grid">
        <div class="stat"><div class="k">湿度</div><div class="v">${c.relative_humidity_2m}%</div></div>
        <div class="stat"><div class="k">雨量(直近1時間)</div><div class="v">${c.precipitation} mm</div></div>
        <div class="stat"><div class="k">今日の降水</div><div class="v">${d.precipitation_sum[0]} mm・${d.precipitation_probability_max[0] ?? "—"}%</div></div>
        <div class="stat"><div class="k">風</div><div class="v"><span class="arrow" style="transform:rotate(${c.wind_direction_10m}deg)">↓</span> ${dirName(c.wind_direction_10m)} ${c.wind_speed_10m} m/s</div></div>
        <div class="stat"><div class="k">最大瞬間風速</div><div class="v">${c.wind_gusts_10m} m/s</div></div>
        <div class="stat"><div class="k">気圧(海面)</div><div class="v">${Math.round(c.pressure_msl)} hPa</div></div>
        <div class="stat"><div class="k">日の出</div><div class="v">🌅 ${hm(d.sunrise[0])}</div></div>
        <div class="stat"><div class="k">日の入</div><div class="v">🌇 ${hm(d.sunset[0])}</div></div>
      </div>`;

    // 24時間
    let i0 = h.time.findIndex(t => t >= c.time.slice(0,13));
    if(i0 < 0) i0 = 0;
    let hs = "";
    for(let i=i0; i<Math.min(i0+24, h.time.length); i++){
      const [e] = wmo(h.weather_code[i]);
      hs += `<div class="hour"><div>${h.time[i].slice(11,13)}時</div><div class="e">${e}</div>
        <div><b>${Math.round(h.temperature_2m[i])}°</b></div>
        <div class="muted">☂${h.precipitation_probability[i] ?? "—"}%</div>
        <div class="muted">${h.precipitation[i]}mm</div>
        <div class="muted"><span class="arrow" style="transform:rotate(${h.wind_direction_10m[i]}deg)">↓</span>${Math.round(h.wind_speed_10m[i])}</div></div>`;
    }
    $("#hourly").innerHTML = hs;

    // 週間
    let rows = "";
    d.time.forEach((t,i) => {
      const dt = new Date(t + "T00:00:00+09:00"), wd = dt.getDay();
      const [e, s] = wmo(d.weather_code[i]);
      rows += `<tr><td class="d ${wd===0?"sun":wd===6?"sat":""}">${dt.getMonth()+1}/${dt.getDate()}(${WD[wd]})</td>
        <td title="${s}">${e}</td>
        <td><span class="hi">${Math.round(d.temperature_2m_max[i])}</span>/<span class="lo">${Math.round(d.temperature_2m_min[i])}</span></td>
        <td>${d.precipitation_probability_max[i] ?? "—"}%</td>
        <td>${d.precipitation_sum[i]}</td>
        <td>${dirName(d.wind_direction_10m_dominant[i])} ${Math.round(d.wind_speed_10m_max[i])}</td></tr>`;
    });
    $("#daily").innerHTML = `<table><thead><tr><th style="text-align:left">日付</th><th>天気</th><th>最高/最低℃</th><th>降水確率</th><th>雨量mm</th><th>風 m/s</th></tr></thead><tbody>${rows}</tbody></table>`;
  }catch(e){
    $("#weather").innerHTML = `<h2>現在の天気</h2><div class="err">気象データを取得できませんでした（${esc(e.message)}）</div>`;
    $("#hourly").innerHTML = ""; $("#daily").innerHTML = "";
  }
}

/* ---------- 警報・注意報 (気象庁) ---------- */
// 気象庁 bosai JSON の種別コード（従来体系）。新体系で未知のコードが来た場合はコード番号で表示します。
const WARN = {
  "02":"暴風雪警報","03":"大雨警報","04":"洪水警報","05":"暴風警報","06":"大雪警報","07":"波浪警報","08":"高潮警報",
  "10":"大雨注意報","12":"大雪注意報","13":"風雪注意報","14":"雷注意報","15":"強風注意報","16":"波浪注意報","17":"融雪注意報",
  "18":"洪水注意報","19":"高潮注意報","20":"濃霧注意報","21":"乾燥注意報","22":"なだれ注意報","23":"低温注意報","24":"霜注意報",
  "25":"着氷注意報","26":"着雪注意報","27":"その他の注意報",
  "32":"暴風雪特別警報","33":"大雨特別警報","35":"暴風特別警報","36":"大雪特別警報","37":"波浪特別警報","38":"高潮特別警報"
};
function warnClass(name){
  if(/特別警報/.test(name)) return "b-emg";
  if(/危険警報/.test(name)) return "b-dng";
  if(/警報/.test(name)) return "b-war";
  return "b-adv";
}
async function loadWarnings(){
  const box = $("#warnings");
  if(!S.office){ box.innerHTML = '<span class="muted">この地点の警報情報は取得できません。</span>'; return; }
  const link = `https://www.jma.go.jp/bosai/warning/#area_type=class20s&area_code=${S.class20}&lang=ja`;
  try{
    const w = await getJSON(`https://www.jma.go.jp/bosai/warning/data/warning/${S.office}.json`);
    let target = null;
    for(const at of (w.areaTypes || [])) for(const a of (at.areas || [])) if(a.code === S.class20) target = a;
    if(!target) for(const at of (w.areaTypes || [])) for(const a of (at.areas || [])) if(a.code === S.class10) target = a;
    const active = (target?.warnings || []).filter(x => x.code && x.status && !/解除|なし/.test(x.status));
    $("#warnTime").textContent = w.reportDatetime ? fmtTime(w.reportDatetime) + " 発表" : "";
    let html = "";
    if(active.length){
      html += active.map(x => {
        const n = x.name || WARN[x.code] || `種別コード${x.code}`;
        return `<span class="badge ${warnClass(n)}">${esc(n)}</span>`;
      }).join("");
    }else{
      html += '<div class="okline">✓ 発表中の警報・注意報はありません</div>';
    }
    html += `<div class="muted" style="margin-top:6px">対象：${esc(S.city)}</div>`;
    if(w.headlineText) html += `<p style="margin:8px 0 0;font-size:.9rem">${esc(w.headlineText)}</p>`;
    html += `<div style="margin-top:8px"><a href="${link}" target="_blank" rel="noopener">気象庁で詳しく見る →</a></div>`;
    box.innerHTML = html;
  }catch(e){
    box.innerHTML = `<div class="err">取得できませんでした（${esc(e.message)}）</div><a href="${link}" target="_blank" rel="noopener">気象庁の警報・注意報ページ →</a>`;
  }
}

/* ---------- 地震・津波 (P2P地震情報) ---------- */
const SCALE = {10:"1",20:"2",30:"3",40:"4",45:"5弱",46:"5弱?",50:"5強",55:"6弱",60:"6強",70:"7"};
function scaleCls(v){ return v>=70?"s7":v>=55?"s6":v>=45?"s5":v>=40?"s4":v>=30?"s3":"s1"; }
async function loadQuakes(){
  const box = $("#quakes");
  try{
    const list = await getJSON("https://api.p2pquake.net/v2/history?codes=551&limit=20");
    const qs = list.filter(q => q.earthquake && q.earthquake.maxScale >= 10).slice(0,6);
    if(!qs.length){ box.innerHTML = '<span class="muted">最近の地震情報はありません。</span>'; }
    else{
      box.innerHTML = '<ul class="list">' + qs.map(q => {
        const e = q.earthquake, hy = e.hypocenter || {};
        const dist = (hy.latitude > -200 && S.lat != null) ? Math.round(distKm(S.lat,S.lon,hy.latitude,hy.longitude)) : null;
        const mine = S.prefName ? (q.points || []).filter(p => p.pref === S.prefName).reduce((m,p) => Math.max(m,p.scale), 0) : 0;
        const tsu = { "None":"", "Unknown":"", "Checking":"津波調査中", "NonEffective":"若干の海面変動", "Watch":"津波注意報", "Warning":"津波警報" }[e.domesticTsunami] || "";
        return `<li><span class="scale ${scaleCls(e.maxScale)}">${SCALE[e.maxScale] || "?"}</span>
          <b>${esc(hy.name || "震源調査中")}</b>
          <div class="muted">${esc(e.time.slice(5,16).replace(/\//g,"/"))}
            ${hy.magnitude > 0 ? ` M${hy.magnitude}` : ""}${hy.depth > 0 ? ` 深さ${hy.depth}km` : hy.depth === 0 ? " ごく浅い" : ""}
            ${dist != null ? ` ・ 約${dist}km` : ""}
            ${mine ? ` ・ ${esc(S.prefName)}で震度${SCALE[mine] || "?"}` : ""}
            ${tsu ? ` ・ <b>${tsu}</b>` : ""}</div></li>`;
      }).join("") + "</ul>";
    }
  }catch(e){
    box.innerHTML = `<div class="err">取得できませんでした（${esc(e.message)}）</div><a href="https://www.jma.go.jp/bosai/map.html#contents=earthquake_map" target="_blank" rel="noopener">気象庁の地震情報 →</a>`;
  }
  // 津波
  try{
    const ts = await getJSON("https://api.p2pquake.net/v2/history?codes=552&limit=1");
    const t = ts[0], el = $("#tsunami");
    const fresh = t && !t.cancelled && (Date.now() - new Date(t.time.replace(/\//g,"-").replace(" ","T")+"+09:00")) < 24*3600e3;
    if(fresh && t.areas?.length){
      const g = { MajorWarning:"大津波警報", Warning:"津波警報", Watch:"津波注意報" };
      const top = ["MajorWarning","Warning","Watch"].find(k => t.areas.some(a => a.grade === k));
      const mine = S.prefName ? t.areas.filter(a => a.name.includes(S.prefName.replace(/[都府県]$/,""))) : [];
      el.innerHTML = `<div class="banner" style="${top==="Watch"?"background:#ca8a04":top==="MajorWarning"?"background:#7e22ce":""}">🌊 ${g[top] || "津波情報"}が発表されています
        ${mine.length ? `<div style="font-weight:normal">${mine.map(a=>esc(a.name)+"："+(g[a.grade]||a.grade)).join("、")}</div>` : ""}
        <div><a style="color:#fff" href="https://www.jma.go.jp/bosai/map.html#contents=tsunami" target="_blank" rel="noopener">気象庁で確認 →</a></div></div>`;
      el.hidden = false;
    }else{ el.hidden = true; }
  }catch(e){}
}

/* ---------- 鉄道 (鉄道遅延情報のJSON) ---------- */
function regionOf(pc){
  if(pc===1) return {id:2,name:"北海道"};
  if(pc<=7) return {id:3,name:"東北"};
  if(pc<=14) return {id:4,name:"関東"};
  if(pc<=24) return {id:5,name:"中部"};
  if(pc<=30) return {id:6,name:"近畿"};
  if(pc<=35) return {id:8,name:"中国"};
  if(pc<=39) return {id:9,name:"四国"};
  return {id:7,name:"九州・沖縄"};
}
const RAIL_KW = {
  "北海道":["JR北海道","札幌","函館","道南いさりび"],
  "東北":["JR東日本","仙台","青い森","IGR","三陸","阿武隈","会津","弘南","由利高原","秋田内陸","山形鉄道","福島交通","八戸"],
  "関東":["JR東日本","東京メトロ","都営","東急","小田急","京王","西武","東武","京急","京成","相鉄","横浜","つくばエクスプレス","首都圏新都市","りんかい","ゆりかもめ","モノレール","北総","新京成","秩父","関東鉄道","埼玉高速","東葉","江ノ","江ノ島","千葉","シーサイド","日暮里","ニューシャトル","上信","上毛","わたらせ","真岡","野岩","いすみ","小湊","銚子","箱根","富士山麓","富士急","伊豆箱根","舞浜"],
  "中部":["JR東海","JR東日本","JR西日本","名鉄","名古屋","あおなみ","愛知環状","リニモ","静岡鉄道","遠州","富山","あいの風","IRいしかわ","トキめき","しなの鉄道","長野電鉄","アルピコ","北陸鉄道","福井","えちぜん","ハピライン","伊豆急","伊豆箱根","岳南","天竜浜名湖","富士急","富士山麓","豊橋","長良川","樽見","明知","伊勢鉄道","三岐","養老","近鉄","大井川","上田電鉄","のと","万葉線"],
  "近畿":["JR西日本","JR東海","大阪メトロ","Osaka Metro","大阪市","阪急","阪神","京阪","南海","近鉄","京都市","神戸","山陽電","北大阪","泉北","能勢","叡山","京福","嵐電","北神","大阪モノレール","和歌山電","紀州","水間","丹後","信楽","近江","ニュートラム","ポートライナー","六甲","北条","嵯峨野"],
  "中国":["JR西日本","広島電鉄","広電","アストラム","広島高速","一畑","岡山電気","井原","智頭","若桜","錦川","水島"],
  "四国":["JR四国","伊予鉄","琴平","琴電","とさでん","土佐くろしお","阿佐海岸"],
  "九州・沖縄":["JR九州","西鉄","西日本鉄道","福岡市","北九州","筑豊","熊本","長崎電気","松浦","島原","南阿蘇","肥薩おれんじ","平成筑豊","甘木","鹿児島","くま川","ゆいレール","沖縄"]
};
async function loadTrains(){
  const box = $("#trains");
  const reg = S.prefCode ? regionOf(S.prefCode) : {id:4,name:"関東"};
  const yahoo = `https://transit.yahoo.co.jp/traininfo/area/${reg.id}/`;
  const linkHtml = `<div style="margin-top:10px"><a href="${yahoo}" target="_blank" rel="noopener">${reg.name}の運行情報をYahoo!路線情報で見る →</a></div>`;
  try{
    const list = await getJSON("https://tetsudo.rti-giken.jp/free/delay.json");
    const kw = RAIL_KW[reg.name] || [];
    const hit = x => kw.some(k => (x.company + x.name).includes(k));
    const near = list.filter(hit), other = list.filter(x => !hit(x));
    const latest = list.reduce((m,x) => Math.max(m, x.lastupdate_gmt || 0), 0);
    $("#trainTime").textContent = latest ? fmtTime(latest*1000) + " 更新" : "";
    const li = x => `<li class="line-delay"><span>⚠️ <b>${esc(x.name)}</b></span><span class="co">${esc(x.company)}</span></li>`;
    let html = `<div class="muted">${esc(reg.name)}エリアで遅延・運転見合わせ中の路線</div>`;
    html += near.length ? `<ul class="list">${near.map(li).join("")}</ul>` : '<div class="okline" style="margin:6px 0">✓ 目立った遅延情報はありません</div>';
    if(other.length){
      html += `<details style="margin-top:8px"><summary class="muted">他地域の遅延（${other.length}件）</summary><ul class="list">${other.map(li).join("")}</ul></details>`;
    }
    html += `<div class="muted" style="margin-top:6px">※ 鉄道各社公式サイトに15分程度以上の遅れが掲載された路線の一覧です。路線ごとの詳細はリンク先で確認してください。</div>`;
    box.innerHTML = html + linkHtml;
  }catch(e){
    box.innerHTML = `<div class="err">運行情報を取得できませんでした（${esc(e.message)}）</div>` + linkHtml;
  }
}

/* ---------- 全体 ---------- */
let loading = false;
async function loadAll(){
  if(loading) return; loading = true;
  $("#refresh").disabled = true;
  renderPlace();
  const pPlace = resolvePlace().then(renderPlace).catch(e => {
    $("#place").innerHTML += ` <span class="err">（地名の特定に失敗：${esc(e.message)}）</span>`;
  });
  await Promise.allSettled([
    loadWeather(),
    pPlace.then(() => Promise.allSettled([loadWarnings(), loadTrains(), loadQuakes()]))
  ]);
  loading = false;
  $("#refresh").disabled = false;
}

$("#refresh").onclick = () => locate();
// 10分ごとに自動更新（画面表示中のみ）
setInterval(() => { if(document.visibilityState === "visible" && S.lat != null) loadAll(); }, 10*60*1000);
locate();
</script>
