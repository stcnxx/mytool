<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>昭和の街あるき</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1a140e;color:#f3e7cf;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
#view{position:fixed;inset:0}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;z-index:5}
.ingame{display:none}
body.playing .ingame{display:block}
body.playing #side.ingame{display:flex}
#hdr{top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);background:rgba(30,22,14,.6);padding:4px 12px;border-radius:999px;font-size:12px;white-space:nowrap;pointer-events:none}
#mini{top:calc(env(safe-area-inset-top) + 40px);left:calc(env(safe-area-inset-left) + 10px);width:120px;height:120px;border-radius:12px;overflow:hidden;border:2px solid rgba(243,231,207,.75);background:#e6d6b0;box-shadow:0 2px 8px rgba(0,0,0,.45);cursor:pointer}
.maplayer{position:absolute;inset:0;overflow:hidden}
.maplayer img{position:absolute;width:256px;height:256px;max-width:none;pointer-events:none}
.mapcv{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#miniLbl{position:absolute;left:4px;bottom:3px;font-size:10px;color:#3a2a1a;background:rgba(255,248,230,.75);padding:0 4px;border-radius:4px;pointer-events:none}
#side{top:calc(env(safe-area-inset-top) + 40px);right:calc(env(safe-area-inset-right) + 10px);flex-direction:column;gap:6px;align-items:flex-end}
.btn{font:inherit;font-size:13px;color:#f8eed8;background:rgba(40,28,18,.75);border:1px solid rgba(243,231,207,.35);border-radius:10px;padding:8px 10px;min-width:44px;cursor:pointer;touch-action:manipulation}
.btn:active{transform:scale(.96)}
.btn.on{background:rgba(150,70,40,.9)}
#joy{left:calc(env(safe-area-inset-left) + 18px);bottom:calc(env(safe-area-inset-bottom) + 22px);width:124px;height:124px;border-radius:50%;background:rgba(243,231,207,.12);border:2px solid rgba(243,231,207,.35);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(243,231,207,.55);pointer-events:none}
#read{left:50%;bottom:calc(env(safe-area-inset-bottom) + 160px);transform:translateX(-50%);display:none;font-size:15px;padding:11px 18px;background:rgba(150,70,40,.92);white-space:nowrap}
#hint{right:14px;bottom:calc(env(safe-area-inset-bottom) + 50px);font-size:12px;opacity:.9;pointer-events:none;transition:opacity 1.2s;text-align:right;text-shadow:0 1px 3px #000}
#ver{right:8px;bottom:calc(env(safe-area-inset-bottom) + 6px);font-size:10px;opacity:.65;pointer-events:none;text-shadow:0 1px 2px #000}
.sheet{position:fixed;z-index:20;left:0;right:0;bottom:0;max-height:72vh;overflow:auto;background:#efe3c8;color:#3a2a1a;border-radius:16px 16px 0 0;padding:16px 18px calc(env(safe-area-inset-bottom) + 18px);box-shadow:0 -4px 20px rgba(0,0,0,.5);display:none;touch-action:pan-y;-webkit-user-select:text;user-select:text}
.sheet h2{margin:0 0 10px;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:20px}
.sheet .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;margin-bottom:4px}
.sheet .then{background:#8a5a2b;color:#fff}
.sheet .now{background:#2f6b7a;color:#fff}
.sheet p{margin:2px 0 12px;line-height:1.7;font-size:14.5px}
.sheet .close{position:sticky;float:right;top:0;background:#3a2a1a;color:#f3e7cf;border:0;border-radius:999px;width:34px;height:34px;font-size:16px}
#mapPanel{position:fixed;inset:0;z-index:25;background:rgba(15,10,6,.82);display:none;overflow:auto;touch-action:pan-y;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 16px)}
#mapCard{max-width:420px;margin:0 auto}
#mapHead{display:flex;gap:6px;align-items:center;margin-bottom:8px}
#mapHead .sp{flex:1}
#big{position:relative;width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#e6d6b0;border:2px solid rgba(243,231,207,.7)}
#bigNote{font-size:11.5px;opacity:.85;margin:6px 2px 10px;line-height:1.5}
#lmList{display:flex;flex-direction:column;gap:6px}
.lmRow{display:flex;align-items:center;gap:8px;background:rgba(243,231,207,.1);border-radius:10px;padding:8px 10px;font-size:14px}
.lmRow span{flex:1}
#title{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#5a4630,#20160d 75%);padding:24px}
#title .box{max-width:380px;text-align:center}
#title h1{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:32px;margin:0 0 6px;letter-spacing:.1em}
#title .sub{font-size:14px;opacity:.9;margin-bottom:18px}
#title p{font-size:13px;line-height:1.7;opacity:.85;text-align:left}
#startBtn{font-size:18px;padding:14px 34px;margin:14px 0 8px;background:#a8452a;border-color:#f3e7cf}
#loadMsg{font-size:12px;min-height:18px;opacity:.9}
</style></head>
<body>
<div id="view"></div>

<div id="hdr" class="hud ingame"></div>
<div id="mini" class="hud ingame"><div class="maplayer" id="miniTiles"></div><canvas class="mapcv" id="miniCv"></canvas><div id="miniLbl">昭和</div></div>
<div id="side" class="hud ingame">
  <button class="btn" id="btnTime"></button>
  <button class="btn" id="btnSeason"></button>
  <button class="btn" id="btnAuto"></button>
  <button class="btn" id="btnMap">🗺 地図</button>
</div>
<div id="joy" class="hud ingame"><div id="knob"></div></div>
<button id="read" class="hud btn"></button>
<div id="hint" class="hud ingame">左のスティックで歩く<br>画面をドラッグで見回す</div>
<div id="ver" class="hud"></div>

<div id="info" class="sheet"><button class="close" id="infoClose">✕</button><h2 id="infoTitle"></h2>
  <span class="tag then">昭和30年代</span><p id="infoThen"></p>
  <span class="tag now">いま</span><p id="infoNow"></p></div>

<div id="mapPanel"><div id="mapCard">
  <div id="mapHead"><button class="btn" id="mShowa">昭和のころ</button><button class="btn" id="mNow">現在</button><span class="sp"></span><button class="btn" id="mapClose">✕ 閉じる</button></div>
  <div id="big"><div class="maplayer" id="bigTiles"></div><canvas class="mapcv" id="bigCv"></canvas></div>
  <div id="bigNote"></div>
  <div id="lmList"></div>
</div></div>

<div id="title"><div class="box">
  <h1>昭和の街あるき</h1>
  <div class="sub">芝・大門 ── 昭和33年（1958年）</div>
  <p>できたばかりの東京タワーを望む、都電の走る下町を歩いてみましょう。名所に近づくと解説が読めます。時間帯や季節を変えたり、地図で「いま」と見比べたりできます。</p>
  <p style="font-size:11.5px;opacity:.7">※街並みは芝・大門あたりをモデルにした再現イメージです。お店や映画館などの名前は架空です。</p>
  <button class="btn" id="startBtn">街へ出る</button>
  <div id="loadMsg">3Dを読み込み中…</div>
</div></div>

<script>
/* ===== UI と状態（3Dの読み込み前から動く） ===== */
const VERSION='v1.0 · 2026-11-23 21:10';
const $=id=>document.getElementById(id);
$('ver').textContent=VERSION;
const S={hour:15,season:0,auto:false,mapMode:'showa',ready:false,wantStart:false,started:false,teleport:null,near:null,envDirty:true,seasonDirty:true,failed:false};
const SEASONS=['春','夏','秋','冬'], SICON=['🌸','🎐','🍁','⛄'];
const LAT0=35.6572, LON0=139.7497, MLAT=111000, MLON=90450;
function hourName(h){return (h>=5&&h<10)?'朝':(h>=10&&h<16)?'昼':(h>=16&&h<19)?'夕':'夜';}
function fmtH(h){h=((h%24)+24)%24;return Math.floor(h)+':'+String(Math.floor((h%1)*60)).padStart(2,'0');}
function updateLabels(){
  $('hdr').textContent='昭和33年（1958） '+SEASONS[S.season]+' · '+hourName(S.hour)+' '+fmtH(S.hour);
  $('btnTime').textContent='🕒 '+hourName(S.hour);
  $('btnSeason').textContent=SICON[S.season]+' '+SEASONS[S.season];
  $('btnAuto').textContent=S.auto?'⏸ 時を止める':'▶ 時を進める';
  $('btnAuto').classList.toggle('on',S.auto);
  $('mShowa').classList.toggle('on',S.mapMode==='showa');
  $('mNow').classList.toggle('on',S.mapMode==='now');
  $('miniLbl').textContent=S.mapMode==='showa'?'昭和':'現在';
}
updateLabels();

const LM=[
 {id:'tower',name:'東京タワーの眺め',x:-13.5,z:-22,r:7,tx:-386,tz:-153,
  then:'昭和33年（1958年）12月に完成した高さ333mの電波塔。当時、自立式の鉄塔としてはパリのエッフェル塔を抜いて世界一の高さでした。テレビ放送の電波を関東一円に届ける役目を担い、完成直後から東京の新名所に。',
  now:'2013年ごろにテレビ電波送信の主役を東京スカイツリーに譲りましたが、展望台とともに今も東京を代表するシンボルです。'},
 {id:'gate',name:'増上寺 三解脱門',x:-18,z:0,r:11,tx:-30,tz:0,
  then:'1622年に建てられた増上寺の正門。空襲をくぐり抜けた江戸時代初期の建物で、国の重要文化財。「三つの煩悩（むさぼり・いかり・おろかさ）から解き放たれる門」という意味の名前です。',
  now:'今も同じ姿で建っていて、門と東京タワーが一緒に見える景色は定番の撮影スポットです。'},
 {id:'tram',name:'都電の停留場',x:6.5,z:25,r:9,tx:3,tz:-40,
  then:'東京の街なかを縦横に走っていた路面電車。日比谷通りにも線路が敷かれ、通勤や買い物の足でした。最盛期には40を超える系統が走り、道路の真ん中の細い安全地帯で電車を待ちました。',
  now:'車の増加で1960年代後半〜70年代はじめに大半が廃止。日比谷通りの線路も消え、都電で今残るのは荒川線（東京さくらトラム）だけです。地下には都営三田線が走っています。'},
 {id:'koban',name:'派出所（交番）',x:10,z:12,r:6,tx:15,tz:12,
  then:'街角の派出所。おまわりさんが道案内や落とし物の世話をする、町の顔なじみでした。当時の正式な名前は「派出所」。',
  now:'1994年に「交番」が正式な名前になりました。この仕組みは海外でも「KOBAN」として紹介されています。'},
 {id:'tv',name:'電器屋の店先テレビ',x:59,z:-6,r:7,tx:58,tz:-8,
  then:'テレビ・洗濯機・冷蔵庫は「三種の神器」と呼ばれた憧れの家電。テレビはまだ高価で、店先のテレビの前にはプロレスや野球の中継を見る人だかりができました。',
  now:'家電はほとんどの家にある時代に。街の電器屋さんは量販店やネット通販に押されて数を減らしました。'},
 {id:'tabako',name:'たばこ屋・赤電話・丸ポスト',x:89,z:6,r:6,tx:89,tz:9,
  then:'店先に置かれた赤い公衆電話（赤電話）と、丸い郵便ポストは昭和の街角の定番。電話のない家も多く、赤電話は町の大事な連絡手段でした。',
  now:'携帯電話の普及で公衆電話は大きく減り、丸型ポストも四角いポストへの置き換えが進みました。'},
 {id:'cinema',name:'映画館',x:151,z:3,r:9,tx:151,tz:10,
  then:'娯楽の王様は映画。昭和33年（1958年）の映画館の入場者数は年間11億人を超え、史上最高を記録しました。大きな手描きの看板が通りを飾りました。',
  now:'テレビの普及で観客は急減。今はシネコンや配信で見るのが中心になりました。'},
 {id:'dagashi',name:'駄菓子屋',x:103.5,z:49.5,r:6,tx:103.5,tz:46,
  then:'子どもたちが小銭を握りしめて通った店。数円で買える飴やくじ引き、めんこやビー玉も並んでいました。',
  now:'数はぐっと減りましたが、昔ながらの店や、懐かしさを売りにした店が今も各地に残っています。'},
 {id:'sento',name:'銭湯',x:179,z:-49,r:9,tx:179,tz:-56,
  then:'家にお風呂がない家も多く、銭湯は毎日通う場所。高い煙突は街の目印で、ご近所どうしの社交場でもありました。',
  now:'内風呂の普及で減り続け、都内で2,600軒を超えた1960年代後半の最盛期から、今はその1割ほどに。'},
 {id:'lot',name:'空き地と土管',x:163,z:50.5,r:9,tx:163,tz:58,
  then:'資材の土管が転がる空き地は子どもたちの遊び場。野球や缶けりで日が暮れるまで遊びました。',
  now:'都心の空き地はビルや駐車場に変わり、遊び場は公園が中心になりました。'},
 {id:'well',name:'井戸ポンプ',x:62.5,z:-50,r:5,tx:60,tz:-50,
  then:'路地には手押しポンプの井戸が残り、打ち水や洗い物に使われていました。',
  now:'水道の普及でほとんど姿を消しましたが、災害用の井戸として残している地域もあります。'},
 {id:'daimon',name:'芝大門',x:240,z:0,r:12,tx:253,tz:0,
  then:'増上寺の表門（総門）だった門で、「大門」という地名の由来。この門は昭和12年（1937年）に鉄筋コンクリートで建て直されたものです。',
  now:'今も大門通りに建っていて、車が門の下をくぐって行き来しています。'},
];

function openInfo(lm){
  $('infoTitle').textContent=lm.name; $('infoThen').textContent=lm.then; $('infoNow').textContent=lm.now;
  $('info').style.display='block';
}
$('infoClose').onclick=()=>{$('info').style.display='none';};
$('read').onclick=()=>{ if(S.near) openInfo(S.near); };

const PRESETS=[7,12,17.5,20.5];
$('btnTime').onclick=()=>{ const n=PRESETS.find(p=>p>S.hour+0.01); S.hour=(n===undefined)?PRESETS[0]:n; S.envDirty=true; updateLabels(); };
$('btnSeason').onclick=()=>{ S.season=(S.season+1)%4; S.seasonDirty=true; S.envDirty=true; updateLabels(); };
$('btnAuto').onclick=()=>{ S.auto=!S.auto; updateLabels(); };
function setMapMode(m){ S.mapMode=m; updateLabels(); if(window.redrawMaps) window.redrawMaps(); updateMapNote(); }
$('mShowa').onclick=()=>setMapMode('showa');
$('mNow').onclick=()=>setMapMode('now');
function updateMapNote(){
  $('bigNote').textContent = S.mapMode==='showa'
   ? '昭和のころ：1961〜69年ごろの航空写真（国土地理院）。写真を読み込めない環境では、再現した街の地図を表示します。赤い点線は都電。'
   : '現在：国土地理院の地図。読み込めない環境では、いまの様子の略図を表示します。都電は廃止され、日比谷通りの地下を都営三田線が走っています。';
}
updateMapNote();
$('btnMap').onclick=()=>{ $('mapPanel').style.display='block'; if(window.redrawMaps) window.redrawMaps(); };
$('mini').onclick=()=>$('btnMap').onclick();
$('mapClose').onclick=()=>{ $('mapPanel').style.display='none'; };
(function(){ const L=$('lmList');
  LM.forEach(lm=>{ const row=document.createElement('div'); row.className='lmRow';
    const sp=document.createElement('span'); sp.textContent=lm.name;
    const r=document.createElement('button'); r.className='btn'; r.textContent='読む'; r.onclick=()=>openInfo(lm);
    const g=document.createElement('button'); g.className='btn'; g.textContent='ここへ行く';
    g.onclick=()=>{ S.teleport=lm; $('mapPanel').style.display='none'; };
    row.append(sp,r,g); L.appendChild(row); });
})();

function startGame(){
  S.started=true; S.near=undefined; document.body.classList.add('playing'); $('title').style.display='none';
  setTimeout(()=>{$('hint').style.opacity=0;},7000);
}
$('startBtn').onclick=()=>{
  if(S.failed){ location.reload(); return; }
  S.wantStart=true;
  if(S.ready) startGame(); else $('loadMsg').textContent='準備ができしだい始まります…';
};
window.__threeFail=function(){ S.failed=true; $('loadMsg').textContent='3Dライブラリを読み込めませんでした。通信状況を確かめて、ボタンを押すと再読み込みします。'; $('startBtn').textContent='再読み込み'; };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onload="window.__threeOk&&window.__threeOk()" onerror="window.__threeFail()"></script>
<script>
/* ===== 3D の街 ===== */
window.__threeOk=function(){ try{ initWorld(); S.ready=true; $('loadMsg').textContent=''; if(S.wantStart) startGame(); }catch(e){ console.error(e); $('loadMsg').textContent='初期化でエラー：'+e.message; } };
if(window.THREE) setTimeout(window.__threeOk,0);

let renderer,scene,camera,clock;
const P={x:30,z:2,yaw:1.25,pitch:0.1};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=rng(19581223);
const rr=(a,b)=>a+R()*(b-a), pick=a=>a[Math.floor(R()*a.length)];

// ---- 道路データ（3Dと地図で共用）
const ROADS=[
 {x1:-11,x2:11,z1:-700,z2:700,t:'main'},          // 日比谷通り
 {x1:11,x2:520,z1:-6,z2:6,t:'main'},              // 大門通り
 {x1:11,x2:340,z1:-52.5,z2:-47.5,t:'alley'},{x1:11,x2:340,z1:47.5,z2:52.5,t:'alley'},
 {x1:11,x2:340,z1:-102.5,z2:-97.5,t:'alley'},{x1:11,x2:340,z1:97.5,z2:102.5,t:'alley'},
 {x1:117.5,x2:122.5,z1:-160,z2:160,t:'alley'},{x1:217.5,x2:222.5,z1:-160,z2:160,t:'alley'},
];
const BOUNDS={x1:-215,x2:338,z1:-158,z2:158};

// ---- 当たり判定
const COLS=[], GRID=new Map(), MAPRECTS=[];
function gk(i,j){return i*100003+j;}
function addCol(minx,minz,maxx,maxz){const c={minx,minz,maxx,maxz};COLS.push(c);
  for(let i=Math.floor(minx/16);i<=Math.floor(maxx/16);i++)for(let j=Math.floor(minz/16);j<=Math.floor(maxz/16);j++){const k=gk(i,j);if(!GRID.has(k))GRID.set(k,[]);GRID.get(k).push(c);} }

// ---- インスタンス用リスト
const BOX=[],PRISM=[],LWIN=[],DWIN=[],SHOP=[],TRUNK=[],FDEC=[],FPINE=[],POLES=[],LAMPS=[],WIRES=[];
function box(x,y,z,sx,sy,sz,c,ry){BOX.push({x,y,z,sx,sy,sz,c,ry:ry||0});}
function prism(x,y,z,sx,sy,sz,c,ry,snow){PRISM.push({x,y,z,sx,sy,sz,c,ry:ry||0,snow:snow!==false});}
function L(b,lx,lz){const c=Math.cos(b.th),s=Math.sin(b.th);return{x:b.cx+lx*c+lz*s,z:b.cz-lx*s+lz*c};}
function plane(list,b,lx,y,lz,sx,sy){const p=L(b,lx,lz);list.push({x:p.x,y,z:p.z,sx,sy,sz:1,ry:b.th});}
function footprint(b){const along=Math.abs(Math.sin(b.th))<0.5;const hx=along?b.w/2:b.d/2,hz=along?b.d/2:b.w/2;return{minx:b.cx-hx,maxx:b.cx+hx,minz:b.cz-hz,maxz:b.cz+hz};}

const BODYC=[0x5e4230,0x6b4a32,0x7d5c40,0x8a6a4a,0xcfc2a6,0xbfb193,0xa89878,0x75604a];

function addHouse(b){
  const kind=b.kind||'main';
  box(b.cx,0,b.cz,(Math.abs(Math.sin(b.th))<0.5?b.w:b.d),b.h,(Math.abs(Math.sin(b.th))<0.5?b.d:b.w),b.body||pick(BODYC));
  const roofH=b.roofH||rr(1.3,2.3);
  if(!b.flat){ prism(b.cx,b.h,b.cz,b.w+0.7,roofH,b.d+0.7,b.roof||pick(ROOFC),b.th); }
  else { const fp=footprint(b); box(b.cx,b.h,b.cz,fp.maxx-fp.minx+0.3,0.35,fp.maxz-fp.minz+0.3,0x8a857c); }
  const f=b.d/2;
  if(kind==='main'){
    const kanban=b.kanban!==undefined?b.kanban:R()<0.35;
    if(kanban){ const p=L(b,0,f-0.2); box(p.x,0,p.z,b.w,b.h+roofH*0.8,0.4,pick(FACADEC),b.th); }
    plane(SHOP,b,0,1.3,f+0.25,b.w*0.86,2.4);
    const e=L(b,0,f+0.75); box(e.x,2.6,e.z,b.w,0.16,1.5,0x3d3430,b.th);
    if(b.shopName!==null){ addSign(b,b.shopName||pick(SHOPS),0,3.35,f+0.27,Math.min(b.w*0.75,4.5),0.85); }
    if(b.h>5.5) plane(R()<0.6?LWIN:DWIN,b,0,b.h-1.9,f+0.25,b.w*0.55,1.1);
  }else{
    plane(DWIN,b,-b.w*0.22,0.95,f+0.02,b.w*0.3,1.9);
    plane(R()<0.55?LWIN:DWIN,b,b.w*0.2,1.45,f+0.02,b.w*0.35,0.9);
    if(b.h>5.5) plane(R()<0.5?LWIN:DWIN,b,0,b.h-1.8,f+0.02,b.w*0.5,0.9);

// 通りに沿って家を並べる
function row(o){
  let pos=o.from;
  while(pos<o.to){
    const w=rr(o.wmin||5,o.wmax||9);
    if(pos+w>o.to)break;
    const sk=(o.skip||[]).find(s=>pos<s[1]&&pos+w>s[0]);
    if(sk){pos=sk[1]+0.3;continue;}
    const d=rr(o.dmin||8,o.dmax||12), h=o.kind==='main'?rr(5.6,8):(R()<0.35?rr(5.8,6.8):rr(3.6,4.6));
    let b;
    if(o.axis==='x') b={cx:pos+w/2,cz:o.line-o.n*d/2,th:o.n>0?0:Math.PI,w,d,h,kind:o.kind};
    else b={cx:o.line-o.n*d/2,cz:pos+w/2,th:o.n>0?Math.PI/2:-Math.PI/2,w,d,h,kind:o.kind};
    if(o.kind==='alley'&&R()<0.15){pos+=w+rr(1,3);continue;}
    addHouse(b); pos+=w+rr(0,0.5);
  }
}

const tmpC=new THREE.Color(),tmpC2=new THREE.Color();
let NIGHT=0;
function applyEnv(){
  const h=S.hour;let a=KF[0],b=KF[1];
  for(let i=0;i<KF.length-1;i++){if(h>=KF[i].h&&h<=KF[i+1].h){a=KF[i];b=KF[i+1];break;}}
  const t=(h-a.h)/Math.max(1e-6,b.h-a.h), lp=(u,v)=>u+(v-u)*t;
  const night=lp(a.night,b.night);NIGHT=night;
  const sky=new THREE.Color(a.sky).lerp(tmpC.setHex(b.sky),t);
  if(S.season===3) sky.lerp(tmpC.setHex(0xb9bec6),0.3*(1-night));
  if(S.season===1) sky.lerp(tmpC.setHex(0x7fbfee),0.15*(1-night));
  scene.background=sky; scene.fog.color.copy(sky);
  scene.fog.near=lp(1,1)*(60-30*night); scene.fog.far=650-330*night;
  hemi.intensity=lp(a.hemi,b.hemi); hemi.color.setHex(0xdfe8f0).lerp(tmpC.setHex(0x6070a8),night);
  dir.intensity=lp(a.sun,b.sun);
  const ang=(h-6)/12*Math.PI;
  if(Math.sin(ang)>0.03){dir.position.set(Math.cos(ang)*300,Math.sin(ang)*300+20,110);
    const warm=1-Math.min(1,Math.sin(ang)*2.2);dir.color.setHex(0xffffff).lerp(tmpC.setHex(0xffa860),warm);}
  else{dir.position.set(-120,220,-80);dir.color.setHex(0x8fa8ff);}
  litMat.color.setHex(0x2b3038).lerp(tmpC.setHex(0xffc56a),Math.min(1,night*1.3));
  shopMat.color.setHex(0x4e4234).lerp(tmpC.setHex(0xffcf85),Math.min(1,night*1.2));
  tramWinMats.forEach(m=>m.color.copy(litMat.color));
  neonMat.color.setHex(0x8a7d6a).lerp(tmpC.setHex(0xfff0c0),night);
  lampPts.material.opacity=night*0.95;
  stars.material.opacity=Math.max(0,night-0.3)*1.2;
  towerLights.visible=night>0.3;
}

function collide(){
  const r=0.35,i0=Math.floor(P.x/16),j0=Math.floor(P.z/16);const seen=new Set();
  for(let i=i0-1;i<=i0+1;i++)for(let j=j0-1;j<=j0+1;j++){const l=GRID.get(gk(i,j));if(!l)continue;
    for(const c of l){if(seen.has(c))continue;seen.add(c);pushOut(c,r);}}
  trams.forEach(t=>pushOut({minx:t.g.position.x-1.2,maxx:t.g.position.x+1.2,minz:t.g.position.z-6,maxz:t.g.position.z+6},r));
  P.x=Math.max(BOUNDS.x1,Math.min(BOUNDS.x2,P.x));P.z=Math.max(BOUNDS.z1,Math.min(BOUNDS.z2,P.z));
}
function pushOut(c,r){const cx=Math.max(c.minx,Math.min(c.maxx,P.x)),cz=Math.max(c.minz,Math.min(c.maxz,P.z));const dx=P.x-cx,dz=P.z-cz,d2=dx*dx+dz*dz;
  if(d2>=r*r)return;
  if(d2>1e-8){const d=Math.sqrt(d2);P.x=cx+dx/d*r;P.z=cz+dz/d*r;}
  else{const pl=P.x-c.minx,pr=c.maxx-P.x,pt=P.z-c.minz,pb=c.maxz-P.z,m=Math.min(pl,pr,pt,pb);
    if(m===pl)P.x=c.minx-r;else if(m===pr)P.x=c.maxx+r;else if(m===pt)P.z=c.minz-r;else P.z=c.maxz+r;}}

function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05);T+=dt;
  if(S.auto){S.hour=(S.hour+dt/20)%24;S.envDirty=true;}
  if(S.seasonDirty){applySeason();S.seasonDirty=false;}
  if(S.envDirty){applyEnv();S.envDirty=false;}
  if(S.teleport){const lm=S.teleport;P.x=lm.x;P.z=lm.z;P.yaw=Math.atan2(-(lm.tx-lm.x),-(lm.tz-lm.z));P.pitch=lm.id==='tower'?0.25:(lm.id==='daimon'||lm.id==='cinema'?0.18:0.02);S.teleport=null;}
  // 移動
  let fx=-joy.y,sx=joy.x;
  if(KEYS.KeyW||KEYS.ArrowUp)fx+=1;if(KEYS.KeyS||KEYS.ArrowDown)fx-=1;if(KEYS.KeyA)sx-=1;if(KEYS.KeyD)sx+=1;
  if(KEYS.ArrowLeft)P.yaw+=1.8*dt;if(KEYS.ArrowRight)P.yaw-=1.8*dt;
  let mag=Math.hypot(fx,sx);if(mag>1){fx/=mag;sx/=mag;mag=1;}
  const sp=(mag>0.95||KEYS.ShiftLeft)?7.5:4.2;
  if(S.started&&mag>0.05){const s=Math.sin(P.yaw),c=Math.cos(P.yaw);P.x+=(-s*fx+c*sx)*sp*dt;P.z+=(-c*fx-s*sx)*sp*dt;}
  collide();
  const bob=mag>0.05?Math.sin(T*9)*0.03*mag:0;
  camera.position.set(P.x,1.55+bob,P.z);camera.rotation.set(P.pitch,P.yaw,0,'YXZ');
  // 都電
  trams.forEach(t=>{
    if(t.wait>0){t.wait-=dt;}else{
      const z=t.g.position.z+t.dirn*t.v*dt;
      if(t.dirn>0&&!t.stopped&&t.g.position.z<25&&z>=25){t.g.position.z=25;t.wait=7;t.stopped=true;}
      else t.g.position.z=z;
      if(t.dirn>0&&t.g.position.z>700){t.g.position.z=-700;t.stopped=false;}
      if(t.dirn<0&&t.g.position.z<-700){t.g.position.z=700;}
    }});
  // 舞うもの
  if(PARTS.visible){const a=PARTS.geometry.attributes.position.array,n=partCfg.n;
    for(let i=0;i<n;i++){const k=i*3;a[k+1]-=partCfg.fall*dt*(0.7+(i%5)*0.12);a[k]+=Math.sin(T*1.3+i)*partCfg.sway*dt;
      if(a[k+1]<0){a[k+1]=22;a[k]=rr(-35,35);a[k+2]=rr(-35,35);}}
    PARTS.position.set(Math.round(P.x/10)*10,0,Math.round(P.z/10)*10);PARTS.geometry.attributes.position.needsUpdate=true;}
  // テレビ
  if(T-lastTv>0.12&&tvCtx){lastTv=T;const g=tvCtx;g.fillStyle='#9aa0a0';g.fillRect(0,0,96,72);
    for(let i=0;i<40;i++){g.fillStyle='rgba(255,255,255,'+(Math.random()*0.25)+')';g.fillRect(0,Math.random()*72,96,1);}
    g.fillStyle='#3d3f40';g.fillRect(8,50,80,4);const k=Math.sin(T*2)*10;g.fillRect(34+k,24,9,26);g.fillRect(52-k,22,10,28);
    g.fillStyle='#2b2d2e';g.font='bold 10px sans-serif';g.fillText('プロレス中継',4,12);tvTex.needsUpdate=true;}
  if(towerLights.visible)towerLights.material.opacity=0.5+0.5*Math.sin(T*3);
  markers.forEach((m,i)=>{m.position.y=m.userData.y+Math.sin(T*2+i)*0.15;});
  // 名所判定
  let near=null,best=1e9;LM.forEach(lm=>{const d=Math.hypot(P.x-lm.x,P.z-lm.z);if(d<lm.r&&d<best){best=d;near=lm;}});
  if(near!==S.near){S.near=near;const b=$('read');if(near&&S.started){b.textContent='📜 '+near.name+' を読む';b.style.display='block';}else b.style.display='none';}
  if(T-lastMap>0.1&&S.started){lastMap=T;drawMap('mini');if($('mapPanel').style.display==='block')drawMap('big');}
  if(T-lastLbl>0.5&&S.auto){lastLbl=T;updateLabels();}
  renderer.render(scene,camera);
}
</script>
</body></html>
