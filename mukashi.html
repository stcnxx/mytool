<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>港区 むかし・いま地図</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;background:#e9e2d0;color:#2b2118}
#map{position:fixed;inset:0;background:#ddd6c4}
#top{position:fixed;z-index:1000;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 8px);background:rgba(250,245,232,.95);border-radius:14px;padding:8px 10px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#top h1{margin:0 0 6px;font-size:15px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
#top .row{display:flex;gap:6px;align-items:center;font-size:12px}
#top select{flex:1;min-width:0;font-size:14px;padding:6px;border-radius:8px;border:1px solid #b9a98a;background:#fff;color:#2b2118}
.lbl{font-weight:bold;white-space:nowrap}
.lbl.old{color:#8a4a1c}.lbl.now{color:#2f6b7a}
#bottom{position:fixed;z-index:1000;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);background:rgba(250,245,232,.95);border-radius:14px;padding:10px;box-shadow:0 -2px 10px rgba(0,0,0,.2)}
.seg{display:flex;border:1px solid #8a4a1c;border-radius:9px;overflow:hidden;margin-bottom:8px}
.seg button{flex:1;border:0;background:#fff;color:#8a4a1c;font-size:14px;padding:7px 0}
.seg button.on{background:#8a4a1c;color:#fff}
#opRow{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:8px}
#opRow input{flex:1}
.btns{display:flex;gap:6px}
.btn{flex:1;font-size:13px;padding:9px 4px;border-radius:9px;border:1px solid #b9a98a;background:#fff;color:#2b2118;touch-action:manipulation}
.btn:active{background:#efe4cc}
#hold.on{background:#2f6b7a;color:#fff}
#msg{font-size:11.5px;color:#6a5a45;margin-top:6px;min-height:15px}
#ver{position:fixed;z-index:1001;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);font-size:9.5px;color:#7a6a55;pointer-events:none}
#divider{position:fixed;z-index:900;top:0;bottom:0;width:0;display:none}
#divider .bar{position:absolute;top:0;bottom:0;left:-1.5px;width:3px;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.6);pointer-events:none}
#divider .handle{position:absolute;top:50%;left:-22px;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:#8a4a1c;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.5);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:ew-resize}
.tagL,.tagR{position:absolute;top:calc(50% + 30px);font-size:11px;padding:2px 6px;border-radius:6px;color:#fff;white-space:nowrap;pointer-events:none}
.tagL{right:8px;background:#8a4a1c}.tagR{left:8px;background:#2f6b7a}
#sheet{position:fixed;z-index:1100;left:0;right:0;bottom:0;max-height:65vh;overflow:auto;background:#faf5e8;border-radius:16px 16px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.35);padding:12px 14px calc(env(safe-area-inset-bottom) + 14px);display:none}
#sheet h2{font-size:16px;margin:2px 0 10px;display:flex;justify-content:space-between;align-items:center}
#sheet h2 button{border:0;background:#2b2118;color:#fff;border-radius:999px;width:32px;height:32px}
#search{display:flex;gap:6px;margin-bottom:10px}
#search input{flex:1;min-width:0;font-size:15px;padding:8px;border-radius:8px;border:1px solid #b9a98a}
#places{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#places button{text-align:left;font-size:13.5px;padding:9px 10px;border-radius:9px;border:1px solid #d6c8a8;background:#fff;color:#2b2118}
#results button{display:block;width:100%;text-align:left;font-size:13.5px;padding:8px 10px;margin-bottom:5px;border-radius:9px;border:1px solid #d6c8a8;background:#fff}
#loadErr{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;background:#e9e2d0;font-size:14px;line-height:1.7}
.leaflet-control-attribution{font-size:10px}
</style></head>
<body>
<div id="map"></div>
<div id="divider"><div class="bar"></div><div class="handle">⇔<span class="tagL" id="tagL">むかし</span><span class="tagR">いま</span></div></div>

<div id="top">
  <h1>港区 むかし・いま地図</h1>
  <div class="row" style="margin-bottom:6px"><span class="lbl old">むかし</span><select id="selOld"></select></div>
  <div class="row"><span class="lbl now">いま</span><select id="selNow"></select></div>
</div>

<div id="bottom">
  <div class="seg"><button id="mOver" class="on">重ねる</button><button id="mSwipe">左右で比べる</button></div>
  <div id="opRow"><span>いま</span><input type="range" id="op" min="0" max="100" value="70"><span>むかし</span></div>
  <div class="btns">
    <button class="btn" id="hold">押す間だけ「いま」</button>
    <button class="btn" id="btnPlaces">📌 場所</button>
    <button class="btn" id="btnLoc">📍 現在地</button>
  </div>
  <div id="msg"></div>
</div>
<div id="ver"></div>

<div id="sheet">
  <h2>港区の場所へ移動<button id="sheetClose">✕</button></h2>
  <form id="search"><input id="q" placeholder="住所・地名（例：六本木 6丁目）" enterkeyhint="search"><button class="btn" style="flex:0 0 64px">検索</button></form>
  <div id="results"></div>
  <div id="places"></div>
</div>
<div id="loadErr">地図の部品を読み込めませんでした。<br>ネットにつながっているか確かめて、ページを再読み込みしてください。</div>

<script>
/* ===== 状態とUI（地図の読み込み前から動く） ===== */
const VERSION='v2.0 · 2026-11-23 21:25';
const $=id=>document.getElementById(id);
$('ver').textContent=VERSION;
const GSI='https://cyberjapandata.gsi.go.jp/xyz/';
const OLD=[
 {id:'ort_riku10',ext:'png',name:'1936〜42年ごろ（戦前の航空写真）'},
 {id:'ort_USA10',ext:'png',name:'1945〜50年（終戦直後・米軍撮影）'},
 {id:'ort_old10',ext:'png',name:'1961〜69年（昭和30〜40年代）'},
 {id:'gazo1',ext:'jpg',name:'1974〜78年'},
 {id:'gazo2',ext:'jpg',name:'1979〜83年'},
 {id:'gazo3',ext:'jpg',name:'1984〜86年'},
 {id:'gazo4',ext:'jpg',name:'1988〜90年'}];
const NOW=[
 {id:'std',ext:'png',name:'地図（標準）'},
 {id:'pale',ext:'png',name:'地図（淡色）'},
 {id:'seamlessphoto',ext:'jpg',name:'最新の航空写真'}];
const PLACES=[
 ['東京タワー',35.6586,139.7454],['増上寺',35.6575,139.7483],['芝大門',35.6568,139.7525],['浜松町駅',35.6555,139.7570],
 ['新橋駅',35.6662,139.7583],['汐留',35.6630,139.7610],['虎ノ門',35.6700,139.7495],['赤坂見附',35.6770,139.7370],
 ['青山一丁目',35.6727,139.7240],['六本木',35.6627,139.7320],['麻布十番',35.6563,139.7368],['有栖川宮記念公園',35.6517,139.7234],
 ['白金高輪',35.6427,139.7340],['田町駅',35.6457,139.7476],['芝浦ふ頭',35.6418,139.7585],['泉岳寺',35.6386,139.7377],
 ['高輪ゲートウェイ駅',35.6355,139.7407],['品川駅',35.6285,139.7388],['お台場海浜公園',35.6298,139.7783]];
// 港区をおおまかに囲む範囲
const MINATO={s:35.612,w:139.705,n:35.690,e:139.795};

let saved={};try{saved=JSON.parse(localStorage.getItem('mukashi')||'{}');}catch(e){}
const S={old:saved.old||'ort_old10',now:saved.now||'std',mode:'over',op:saved.op??70,swipe:0.5,hold:false};

OLD.forEach(o=>$('selOld').add(new Option(o.name,o.id)));
NOW.forEach(o=>$('selNow').add(new Option(o.name,o.id)));
$('selOld').value=S.old;$('selNow').value=S.now;$('op').value=S.op;
function save(){try{const c=map?map.getCenter():null;localStorage.setItem('mukashi',JSON.stringify({old:S.old,now:S.now,op:S.op,lat:c&&c.lat,lng:c&&c.lng,z:map&&map.getZoom()}));}catch(e){}}
function msg(t){$('msg').textContent=t||'';}
function oldName(){return OLD.find(o=>o.id===S.old).name;}

$('selOld').onchange=()=>{S.old=$('selOld').value;apply();save();};
$('selNow').onchange=()=>{S.now=$('selNow').value;apply();save();};
$('op').oninput=()=>{S.op=+$('op').value;apply();};
$('op').onchange=save;
$('mOver').onclick=()=>{S.mode='over';apply();};
$('mSwipe').onclick=()=>{S.mode='swipe';apply();};
const holdOn=e=>{e.preventDefault();S.hold=true;apply();}, holdOff=()=>{if(S.hold){S.hold=false;apply();}};
$('hold').addEventListener('pointerdown',holdOn);
['pointerup','pointercancel','pointerleave'].forEach(t=>$('hold').addEventListener(t,holdOff));
$('btnPlaces').onclick=()=>{$('sheet').style.display='block';};
$('sheetClose').onclick=()=>{$('sheet').style.display='none';};
PLACES.forEach(p=>{const b=document.createElement('button');b.textContent=p[0];b.onclick=()=>goTo(p[1],p[2],17,p[0]);$('places').appendChild(b);});

let pendingGo=null;
function goTo(lat,lng,z,name){
  $('sheet').style.display='none';
  if(name)msg('「'+name+'」へ移動しました');
  if(map)map.setView([lat,lng],z);else pendingGo=[lat,lng,z];
}

// 地名検索（国土地理院の住所検索）
let searchSeq=0;
$('search').onsubmit=async e=>{
  e.preventDefault();const q=$('q').value.trim();if(!q)return;
  const my=++searchSeq;const R=$('results');R.textContent='検索中…';
  const query=/港区/.test(q)?q:'東京都港区 '+q;
  try{
    const res=await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q='+encodeURIComponent(query));
    const js=await res.json();if(my!==searchSeq)return;
    const hits=js.filter(f=>{const[lng,lat]=f.geometry.coordinates;return lat>MINATO.s&&lat<MINATO.n&&lng>MINATO.w&&lng<MINATO.e;}).slice(0,12);
    R.textContent='';
    if(!hits.length){R.textContent='港区内で見つかりませんでした。';return;}
    hits.forEach(f=>{const b=document.createElement('button');b.textContent=f.properties.title;const[lng,lat]=f.geometry.coordinates;b.onclick=()=>goTo(lat,lng,17,f.properties.title);R.appendChild(b);});
  }catch(err){if(my===searchSeq)R.textContent='検索できませんでした（通信を確かめてください）。';}
};

// 現在地
let locMarker=null;
$('btnLoc').onclick=()=>{
  if(!navigator.geolocation){msg('この端末では現在地を使えません');return;}
  msg('現在地を取得中…');
  navigator.geolocation.getCurrentPosition(p=>{
    const {latitude:lat,longitude:lng}=p.coords;
    if(lat<MINATO.s||lat>MINATO.n||lng<MINATO.w||lng>MINATO.e){msg('現在地は港区の外のようです');return;}
    msg('現在地を表示しました');
    if(map){map.setView([lat,lng],17);if(locMarker)locMarker.setLatLng([lat,lng]);else locMarker=L.circleMarker([lat,lng],{radius:8,color:'#fff',weight:3,fillColor:'#1f6fd0',fillOpacity:1}).addTo(map);}
    else pendingGo=[lat,lng,17];
  },err=>{msg(err.code===1?'現在地の利用が許可されていません':'現在地を取得できませんでした');},{enableHighAccuracy:true,timeout:15000});
};

/* ===== 地図 ===== */
let map=null,oldLayer=null,nowLayer=null,oldPane=null;
function tileLayer(o,pane){
  return L.tileLayer(GSI+o.id+'/{z}/{x}/{y}.'+o.ext,{pane:pane||'tilePane',minZoom:11,maxZoom:19,maxNativeZoom:o.id==='std'||o.id==='pale'?18:17,minNativeZoom:o.id.startsWith('ort')||o.id.startsWith('gazo')?10:5,
    attribution:'出典：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'});
}
function apply(){
  $('selOld').value=S.old;$('selNow').value=S.now;
  $('mOver').classList.toggle('on',S.mode==='over');$('mSwipe').classList.toggle('on',S.mode==='swipe');
  $('opRow').style.display=S.mode==='over'?'flex':'none';
  $('divider').style.display=S.mode==='swipe'&&!S.hold?'block':'none';
  $('hold').classList.toggle('on',S.hold);
  $('tagL').textContent=OLD.find(o=>o.id===S.old).name.split('（')[0];
  if(!map)return;
  if(!oldLayer||oldLayer._id!==S.old){if(oldLayer)map.removeLayer(oldLayer);oldLayer=tileLayer(OLD.find(o=>o.id===S.old),'oldPane');oldLayer._id=S.old;oldLayer.addTo(map);}
  if(!nowLayer||nowLayer._id!==S.now){if(nowLayer)map.removeLayer(nowLayer);nowLayer=tileLayer(NOW.find(o=>o.id===S.now));nowLayer._id=S.now;nowLayer.addTo(map);}
  oldPane.style.opacity=S.hold?0:(S.mode==='over'?S.op/100:1);
  updateClip();
}
function updateClip(){
  if(!map)return;
  if(S.mode!=='swipe'||S.hold){oldPane.style.clip='';return;}
  const size=map.getSize(),nw=map.containerPointToLayerPoint([0,0]),se=map.containerPointToLayerPoint(size);
  const x=nw.x+size.x*S.swipe;
  oldPane.style.clip='rect('+nw.y+'px,'+x+'px,'+se.y+'px,'+nw.x+'px)';
  $('divider').style.left=(map.getContainer().getBoundingClientRect().left+size.x*S.swipe)+'px';
}
// 仕切り線のドラッグ
(function(){const h=document.querySelector('#divider .handle');let id=null;
  h.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();id=e.pointerId;h.setPointerCapture(id);});
  h.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;S.swipe=Math.max(0.03,Math.min(0.97,e.clientX/innerWidth));updateClip();});
  const end=e=>{if(e.pointerId===id)id=null;};h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
})();

function initMap(){
  const b=L.latLngBounds([MINATO.s,MINATO.w],[MINATO.n,MINATO.e]);
  map=L.map('map',{zoomControl:false,maxBounds:b.pad(0.15),maxBoundsViscosity:0.8,minZoom:13,maxZoom:19});
  L.control.zoom({position:'topright'}).addTo(map);
  oldPane=map.createPane('oldPane');oldPane.style.zIndex=250;
  if(pendingGo)map.setView([pendingGo[0],pendingGo[1]],pendingGo[2]);
  else if(saved.lat)map.setView([saved.lat,saved.lng],saved.z||15);
  else map.fitBounds(b);
  map.on('move zoom resize viewreset zoomend moveend',updateClip);
  map.on('moveend',save);
  apply();
  msg('「むかし」は '+oldName()+' の航空写真です');
}
apply();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" onload="initMap()" onerror="document.getElementById('loadErr').style.display='flex'"></script>
</body></html>
