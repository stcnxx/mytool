<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>東京23区 むかし・いま地図</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;background:#e9e2d0;color:#2b2118}
#map{position:fixed;inset:0;background:#ddd6c4}
#drawer{position:fixed;z-index:1000;left:0;right:0;bottom:0;background:rgba(250,245,232,.97);border-radius:16px 16px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.25);padding:0 10px calc(env(safe-area-inset-bottom) + 8px);transition:transform .28s ease;will-change:transform}
#drawer.dragging{transition:none}
#tab{height:30px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:#6a5a45;touch-action:none;cursor:grab}
#tab .grip{width:38px;height:5px;border-radius:3px;background:#b9a98a}
#tabLbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selRow{display:grid;grid-template-columns:3.2em 1fr;gap:6px;align-items:center;font-size:12px;margin-bottom:6px}
.selRow select{width:100%;min-width:0;font-size:14px;padding:5px 6px;border-radius:8px;border:1px solid #b9a98a;background:#fff;color:#2b2118}
.lbl{font-weight:bold;white-space:nowrap}
.lbl.old{color:#8a4a1c}.lbl.now{color:#2f6b7a}
.seg{display:flex;border:1px solid #8a4a1c;border-radius:9px;overflow:hidden;margin-bottom:6px}
.seg button{flex:1;border:0;background:#fff;color:#8a4a1c;font-size:13px;padding:5px 0}
.seg button.on{background:#8a4a1c;color:#fff}
#opRow{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px}
#opRow input{flex:1}
.btns{display:flex;gap:6px}
.btn{flex:1;font-size:13px;padding:5px 4px;border-radius:9px;border:1px solid #b9a98a;background:#fff;color:#2b2118;touch-action:manipulation}
.btn:active{background:#efe4cc}
#ver{font-size:9.5px;color:#9a8a70;text-align:right;margin-top:4px}
#toast{position:fixed;z-index:1001;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 42px);background:rgba(43,33,24,.85);color:#fff;font-size:12px;padding:5px 12px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .4s,bottom .28s;pointer-events:none}
#toast.show{opacity:1}
.leaflet-bottom{bottom:calc(env(safe-area-inset-bottom) + 30px)}
#divider{position:fixed;z-index:900;top:0;bottom:0;width:0;display:none}
#divider .bar{position:absolute;top:0;bottom:0;left:-1.5px;width:3px;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.6);pointer-events:none}
#divider .handle{position:absolute;top:50%;left:-22px;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:#8a4a1c;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.5);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:ew-resize}
.tagL,.tagR{position:absolute;top:calc(50% + 30px);font-size:11px;padding:2px 6px;border-radius:6px;color:#fff;white-space:nowrap;pointer-events:none}
.tagL{right:8px;background:#8a4a1c}.tagR{left:8px;background:#2f6b7a}
#sheet{position:fixed;z-index:1100;left:0;right:0;bottom:0;max-height:65vh;overflow:auto;background:#faf5e8;border-radius:16px 16px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.35);padding:12px 14px calc(env(safe-area-inset-bottom) + 14px);display:none}
#sheet h2{font-size:16px;margin:2px 0 10px;display:flex;justify-content:space-between;align-items:center}
#sheet h2 button{border:0;background:#2b2118;color:#fff;border-radius:999px;width:32px;height:32px}
#search{display:flex;gap:6px;margin-bottom:10px}
#search input{flex:1;min-width:0;font-size:15px;padding:8px;border-radius:8px;border:1px solid #b9a98a}
#places{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#places button{text-align:left;font-size:13.5px;padding:9px 10px;border-radius:9px;border:1px solid #d6c8a8;background:#fff;color:#2b2118}
#results button{display:block;width:100%;text-align:left;font-size:13.5px;padding:8px 10px;margin-bottom:5px;border-radius:9px;border:1px solid #d6c8a8;background:#fff}
#loadErr{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;background:#e9e2d0;font-size:14px;line-height:1.7}
.leaflet-control-attribution{font-size:10px}
</style></head>
<body>
<div id="map"></div>
<div id="divider"><div class="bar"></div><div class="handle">⇔<span class="tagL" id="tagL">むかし</span><span class="tagR">いま</span></div></div>

<div id="toast"></div>
<div id="drawer">
  <div id="tab"><span class="grip"></span><span id="tabLbl"></span></div>
  <div class="selRow"><span class="lbl old">むかし</span><select id="selOld"></select></div>
  <div class="selRow"><span class="lbl now">いま</span><select id="selNow"></select></div>
  <div class="seg"><button id="mOver" class="on">重ねる</button><button id="mSwipe">左右で比べる</button></div>
  <div id="opRow"><span>いま</span><input type="range" id="op" min="0" max="100" value="70"><span>むかし</span></div>
  <div class="btns">
    <button class="btn" id="btnPlaces">📌 場所検索</button>
    <button class="btn" id="btnLoc">📍 現在地へ</button>
  </div>
  <div id="ver"></div>
</div>

<div id="sheet">
  <h2>場所へ移動<button id="sheetClose">✕</button></h2>
  <form id="search"><input id="q" placeholder="地名・住所・建物名（例：六本木ヒルズ）" enterkeyhint="search"><button class="btn" style="flex:0 0 64px">検索</button></form>
  <div id="results"></div>
  <div id="places"></div>
</div>
<div id="loadErr">地図の部品を読み込めませんでした。<br>ネットにつながっているか確かめて、ページを再読み込みしてください。</div>

<script>
/* ===== 状態とUI（地図の読み込み前から動く） ===== */
const VERSION='v2.2 · 2026-11-25 06:20';
const $=id=>document.getElementById(id);
$('ver').textContent=VERSION;
const GSI='https://cyberjapandata.gsi.go.jp/xyz/';
const OLD=[
 {id:'ort_riku10',ext:'png',name:'1936〜42年ごろ（戦前の航空写真）'},
 {id:'ort_USA10',ext:'png',name:'1945〜50年（終戦直後・米軍撮影）'},
 {id:'ort_old10',ext:'png',name:'1961〜69年（昭和30〜40年代）'},
 {id:'gazo1',ext:'jpg',name:'1974〜78年'},
 {id:'gazo2',ext:'jpg',name:'1979〜83年'},
 {id:'gazo3',ext:'jpg',name:'1984〜86年'},
 {id:'gazo4',ext:'jpg',name:'1988〜90年'}];
const NOW=[
 {id:'std',ext:'png',name:'地図（標準）'},
 {id:'pale',ext:'png',name:'地図（淡色）'},
 {id:'seamlessphoto',ext:'jpg',name:'最新の航空写真'}];
const PLACES=[
 ['東京駅',35.6812,139.7671],['皇居',35.6852,139.7528],['日本橋',35.6840,139.7745],['銀座四丁目',35.6717,139.7650],
 ['築地',35.6655,139.7707],['月島',35.6640,139.7820],['豊洲',35.6550,139.7964],['秋葉原駅',35.6984,139.7731],
 ['神田神保町',35.6959,139.7576],['東京ドーム',35.7056,139.7519],['上野駅',35.7138,139.7773],['谷中',35.7266,139.7660],
 ['浅草寺',35.7148,139.7967],['東京スカイツリー',35.7101,139.8107],['両国国技館',35.6969,139.7934],['北千住駅',35.7497,139.8049],
 ['柴又帝釈天',35.7584,139.8770],['葛西臨海公園',35.6430,139.8613],['巣鴨',35.7334,139.7393],['池袋駅',35.7295,139.7109],
 ['赤羽駅',35.7778,139.7210],['新宿駅',35.6896,139.7006],['新宿御苑',35.6852,139.7101],['中野駅',35.7058,139.6658],
 ['明治神宮',35.6764,139.6993],['原宿駅',35.6702,139.7027],['渋谷駅',35.6580,139.7016],['下北沢',35.6613,139.6680],
 ['二子玉川',35.6115,139.6268],['自由が丘',35.6076,139.6688],['赤坂',35.6770,139.7370],['六本木',35.6627,139.7320],
 ['東京タワー',35.6586,139.7454],['新橋駅',35.6662,139.7583],['品川駅',35.6285,139.7388],['お台場',35.6298,139.7783],
 ['羽田空港',35.5494,139.7798]];
// 東京23区をおおまかに囲む範囲
const MINATO={s:35.515,w:139.555,n:35.825,e:139.925};

let saved={};try{saved=JSON.parse(localStorage.getItem('mukashi')||'{}');}catch(e){}
const S={old:saved.old||'ort_old10',now:saved.now||'std',mode:'over',op:saved.op??70,swipe:0.5};

OLD.forEach(o=>$('selOld').add(new Option(o.name,o.id)));
NOW.forEach(o=>$('selNow').add(new Option(o.name,o.id)));
$('selOld').value=S.old;$('selNow').value=S.now;$('op').value=S.op;
function save(){try{const c=map?map.getCenter():null;localStorage.setItem('mukashi',JSON.stringify({old:S.old,now:S.now,op:S.op,lat:c&&c.lat,lng:c&&c.lng,z:map&&map.getZoom()}));}catch(e){}}
let toastT=0;
function msg(t){const el=$('toast');if(!t)return;el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2600);}
/* ---- 下から引き出す操作欄 ---- */
const DR=$('drawer'),TAB=$('tab'),TABH=30,IDLE=8000;
let drOpen=false,idleT=0;
function closedY(){return DR.offsetHeight-TABH;}
function setDrawer(open){drOpen=open;DR.style.transform=open?'translateY(0)':'translateY('+closedY()+'px)';
  $('toast').style.bottom='calc(env(safe-area-inset-bottom) + '+((open?DR.offsetHeight:TABH)+12)+'px)';
  updateTab();open?poke():clearTimeout(idleT);}
function updateTab(){$('tabLbl').textContent=drOpen?'▼ 閉じる':'▲ '+OLD.find(o=>o.id===S.old).name.split('（')[0]+' × '+NOW.find(o=>o.id===S.now).name;}
function poke(){clearTimeout(idleT);if(!drOpen)return;idleT=setTimeout(()=>{
  const a=document.activeElement;if(DR.contains(a)&&a.tagName==='SELECT'){poke();return;}
  if($('sheet').style.display==='block'){poke();return;}
  setDrawer(false);},IDLE);}
['pointerdown','input','change','focusin'].forEach(t=>DR.addEventListener(t,poke));
(function(){let id=null,y0=0,base=0,moved=false;
  TAB.addEventListener('pointerdown',e=>{id=e.pointerId;TAB.setPointerCapture(id);y0=e.clientY;base=drOpen?0:closedY();moved=false;DR.classList.add('dragging');});
  TAB.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;const dy=e.clientY-y0;if(Math.abs(dy)>5)moved=true;
    DR.style.transform='translateY('+Math.max(0,Math.min(closedY(),base+dy))+'px)';});
  const end=e=>{if(e.pointerId!==id)return;id=null;DR.classList.remove('dragging');const dy=e.clientY-y0;
    if(!moved)setDrawer(!drOpen);else if(dy<-30)setDrawer(true);else if(dy>30)setDrawer(false);else setDrawer(drOpen);};
  TAB.addEventListener('pointerup',end);TAB.addEventListener('pointercancel',end);
})();
addEventListener('resize',()=>setDrawer(drOpen));
function oldName(){return OLD.find(o=>o.id===S.old).name;}

$('selOld').onchange=()=>{S.old=$('selOld').value;apply();save();};
$('selNow').onchange=()=>{S.now=$('selNow').value;apply();save();};
$('op').oninput=()=>{S.op=+$('op').value;apply();};
$('op').onchange=save;
$('mOver').onclick=()=>{S.mode='over';apply();};
$('mSwipe').onclick=()=>{S.mode='swipe';apply();};
$('btnPlaces').onclick=()=>{$('sheet').style.display='block';setDrawer(false);};
$('sheetClose').onclick=()=>{$('sheet').style.display='none';};
PLACES.forEach(p=>{const b=document.createElement('button');b.textContent=p[0];b.onclick=()=>goTo(p[1],p[2],17,p[0]);$('places').appendChild(b);});

let pendingGo=null;
function goTo(lat,lng,z,name){
  $('sheet').style.display='none';
  if(name)msg('「'+name+'」へ移動しました');
  if(map)map.setView([lat,lng],z);else pendingGo=[lat,lng,z];
}

// 検索：地名・住所は国土地理院、建物名・施設名はOpenStreetMap（Photon）
const inArea=(lat,lng)=>lat>MINATO.s&&lat<MINATO.n&&lng>MINATO.w&&lng<MINATO.e;
async function gsiSearch(q){
  const r=await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q='+encodeURIComponent(q));
  return (await r.json()).map(f=>({title:f.properties.title,sub:'地名・住所',lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0]})).filter(h=>inArea(h.lat,h.lng));
}
const SKIP=/^(defibrillator|bicycle_parking|bicycle_rental|vending_machine|waste_basket|bench|toilets|parking_entrance|charging_station|post_box|telephone|atm)$/;
async function osmSearch(q){
  const bb=[MINATO.w,MINATO.s,MINATO.e,MINATO.n].join(',');
  const r=await fetch('https://photon.komoot.io/api/?limit=20&lang=default&bbox='+bb+'&q='+encodeURIComponent(q));
  const seen=new Set();
  return (await r.json()).features.filter(f=>f.properties.name&&!SKIP.test(f.properties.osm_value)&&f.properties.osm_key!=='emergency').map(f=>{const p=f.properties;
    return {title:p.name,sub:'建物・施設（'+[p.district||p.city,p.locality].filter(Boolean).join(' ')+'）',lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0]};})
   .filter(h=>{if(!inArea(h.lat,h.lng))return false;const k=h.title+'|'+h.lat.toFixed(3)+h.lng.toFixed(3);if(seen.has(k))return false;seen.add(k);return true;}).slice(0,10);
}
let searchSeq=0;
$('search').onsubmit=async e=>{
  e.preventDefault();$('q').blur();const q=$('q').value.trim();if(!q)return;
  const my=++searchSeq;const R=$('results');R.textContent='検索中…';
  const [a,b]=await Promise.allSettled([osmSearch(q),gsiSearch(q)]);
  if(my!==searchSeq)return;
  const hits=[...(a.value||[]),...(b.value||[])].slice(0,15);
  R.textContent='';
  if(!hits.length){R.textContent=(a.status==='rejected'&&b.status==='rejected')?'検索できませんでした（通信を確かめてください）。':'23区内で見つかりませんでした。';return;}
  hits.forEach(h=>{const btn=document.createElement('button');btn.textContent=h.title;const sm=document.createElement('small');sm.textContent='　'+h.sub;sm.style.color='#8a7a60';btn.appendChild(sm);
    btn.onclick=()=>goTo(h.lat,h.lng,18,h.title);R.appendChild(btn);});
};

// 現在地
let locMarker=null;
$('btnLoc').onclick=()=>{
  if(!navigator.geolocation){msg('この端末では現在地を使えません');return;}
  msg('現在地を取得中…');
  navigator.geolocation.getCurrentPosition(p=>{
    const {latitude:lat,longitude:lng}=p.coords;
    if(lat<MINATO.s||lat>MINATO.n||lng<MINATO.w||lng>MINATO.e){msg('現在地は23区の外のようです');return;}
    msg('現在地を表示しました');
    if(map){map.setView([lat,lng],17);if(locMarker)locMarker.setLatLng([lat,lng]);else locMarker=L.circleMarker([lat,lng],{radius:8,color:'#fff',weight:3,fillColor:'#1f6fd0',fillOpacity:1}).addTo(map);}
    else pendingGo=[lat,lng,17];
  },err=>{msg(err.code===1?'現在地の利用が許可されていません':'現在地を取得できませんでした');},{enableHighAccuracy:true,timeout:15000});
};

/* ===== 地図 ===== */
let map=null,oldLayer=null,nowLayer=null,oldPane=null;
function tileLayer(o,pane){
  return L.tileLayer(GSI+o.id+'/{z}/{x}/{y}.'+o.ext,{pane:pane||'tilePane',minZoom:10,maxZoom:19,maxNativeZoom:o.id==='std'||o.id==='pale'?18:17,minNativeZoom:o.id.startsWith('ort')||o.id.startsWith('gazo')?10:5,
    attribution:'出典：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>／検索：<a href="https://www.openstreetmap.org/copyright" target="_blank">© OpenStreetMap</a>'});
}
function apply(){
  $('selOld').value=S.old;$('selNow').value=S.now;
  $('mOver').classList.toggle('on',S.mode==='over');$('mSwipe').classList.toggle('on',S.mode==='swipe');
  $('opRow').style.display=S.mode==='over'?'flex':'none';
  $('divider').style.display=S.mode==='swipe'?'block':'none';
  updateTab();
  $('tagL').textContent=OLD.find(o=>o.id===S.old).name.split('（')[0];
  if(!map)return;
  if(!oldLayer||oldLayer._id!==S.old){if(oldLayer)map.removeLayer(oldLayer);oldLayer=tileLayer(OLD.find(o=>o.id===S.old),'oldPane');oldLayer._id=S.old;oldLayer.addTo(map);}
  if(!nowLayer||nowLayer._id!==S.now){if(nowLayer)map.removeLayer(nowLayer);nowLayer=tileLayer(NOW.find(o=>o.id===S.now));nowLayer._id=S.now;nowLayer.addTo(map);}
  oldPane.style.opacity=S.mode==='over'?S.op/100:1;
  updateClip();
}
function updateClip(){
  if(!map)return;
  if(S.mode!=='swipe'){oldPane.style.clip='';return;}
  const size=map.getSize(),nw=map.containerPointToLayerPoint([0,0]),se=map.containerPointToLayerPoint(size);
  const x=nw.x+size.x*S.swipe;
  oldPane.style.clip='rect('+nw.y+'px,'+x+'px,'+se.y+'px,'+nw.x+'px)';
  $('divider').style.left=(map.getContainer().getBoundingClientRect().left+size.x*S.swipe)+'px';
}
// 仕切り線のドラッグ
(function(){const h=document.querySelector('#divider .handle');let id=null;
  h.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();id=e.pointerId;h.setPointerCapture(id);});
  h.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;S.swipe=Math.max(0.03,Math.min(0.97,e.clientX/innerWidth));updateClip();});
  const end=e=>{if(e.pointerId===id)id=null;};h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
})();

function initMap(){
  const b=L.latLngBounds([MINATO.s,MINATO.w],[MINATO.n,MINATO.e]);
  map=L.map('map',{zoomControl:false,maxBounds:b.pad(0.15),maxBoundsViscosity:0.8,minZoom:11,maxZoom:19});
  L.control.zoom({position:'topright'}).addTo(map);
  oldPane=map.createPane('oldPane');oldPane.style.zIndex=250;
  if(pendingGo)map.setView([pendingGo[0],pendingGo[1]],pendingGo[2]);
  else if(saved.lat)map.setView([saved.lat,saved.lng],saved.z||15);
  else map.fitBounds(b);
  map.on('move zoom resize viewreset zoomend moveend',updateClip);
  map.on('moveend',save);
  apply();
  msg('「むかし」は '+oldName()+' の航空写真です');
}
apply();
setDrawer(false);
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" onload="initMap()" onerror="document.getElementById('loadErr').style.display='flex'"></script>
</body></html>
